<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Leaderboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: center;
    }
    th {
      background: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Student Leaderboard</h1>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Student ID</th>
        <th>Score</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <!-- Data will load here -->
    </tbody>
  </table>

  <script>
    async function loadLeaderboard() {
      try {
        const response = await fetch("leaderboard.json"); // fetch JSON file
        const data = await response.json();

        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = "";

        data.forEach((student, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${student.id}</td>
            <td>${student.score}</td>
            <td>${student.time_taken}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error("Error loading leaderboard:", error);
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
